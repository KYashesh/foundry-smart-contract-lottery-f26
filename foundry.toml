[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    '@chainlink/contracts/=lib/chainlink-brownie-contracts/contracts/',
    '@solmate/ = lib/solmate/src/',
]
fs_permissions = [
    { access = "read", path = "./broadcast" },
    { access = "read", path = "./reports" },
]

[lint]
exclude_lints = ["block-timestamp", "func-mutability", "var-name-mixedcase"]

[fuzz]
runs = 256
# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md](https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md)
